<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password</title>
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
  <main class="panel form-shell">
    <p class="eyebrow">Project of &#924;&#949;&#952;&#949;&#957;&#953;&#964;&#951;&#962; &#922;&#969;&#957;&#963;&#964;&#945;&#957;&#964;&#953;&#957;&#959;&#962;</p>
    <h1>Update Password</h1>
    <form id="passwordForm" action="password-update" method="post" novalidate>
      <label>Username<input type="text" name="username" autocomplete="username" required></label>
      <label>Existing password<input type="password" name="currentPassword" autocomplete="current-password" required></label>
      <label>New password<input type="password" name="newPassword1" required></label>
      <label>Repeat new password<input type="password" name="newPassword2" required></label>
      <label>Repeat again<input type="password" name="newPassword3" required></label>
      <p id="passwordError" class="error hidden"></p>
      <button class="button primary" type="submit">Update</button>
    </form>
    <p class="small-links"><a href="index.html">Home</a> · <a href="login.html">Login</a></p>
  </main>
  <script src="js/password-update.js"></script>
</body>
</html>
